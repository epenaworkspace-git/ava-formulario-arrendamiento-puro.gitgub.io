<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVA – Formulario Arrendamiento Puro</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Outfit:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<script src="https://www.google.com/recaptcha/api.js?render=6Lc9zGUsAAAAAG2K5TAav3VrS9obGfFqXO5cnOkV" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════
   VARIABLES GLOBALES Y TOKENS DE DISEÑO
   ═══════════════════════════════════════════════════════════════ */
:root {
  --navy: #0A1F44; --blue: #165DFF; --blue-light: #3a7fff; --white: #FFFFFF;
  --dark: #333333; --gray-100: #F4F6FB; --gray-200: #E8ECF4; --gray-400: #9BA8C0;
  --gray-500: #6B7A99; --success: #0FC373; --warning: #F59E0B; --error: #FF4757;
  --card-bg: rgba(255,255,255,0.97); --shadow: 0 8px 40px rgba(10,31,68,0.10);
  --font-display: 'Outfit', sans-serif; /* Nueva fuente para el resumen */
  --radius: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--gray-100); color: var(--dark); min-height: 100vh; font-size: 15px; }

/* HEADER */
.header { background: var(--navy); position: relative; overflow: hidden; }
.header-inner { max-width: 900px; margin: 0 auto; padding: 36px 32px 32px; position: relative; z-index: 2; }
.logo-text { font-family: 'Syne', sans-serif; font-size: 38px; font-weight: 800; color: var(--white); letter-spacing: -1px; }
.logo-text span { color: var(--blue); }
.header-title { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; color: var(--white); margin-top: 18px; }

/* MAIN LAYOUT */
.main { max-width: 900px; margin: 0 auto; padding: 36px 20px 100px; }

/* FORM CARDS */
.form-card { background: var(--card-bg); border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 24px; overflow: hidden; animation: fadeSlide 0.35s ease; }
@keyframes fadeSlide { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.section-header { background: var(--navy); padding: 18px 28px; display: flex; align-items: center; gap: 12px; }
.section-title { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--white); }
.section-body { padding: 28px; }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 20px; }
.field-group { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 12px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.7px; }
.field-input { background: var(--gray-100); border: 1.5px solid var(--gray-200); border-radius: 10px; padding: 11px 14px; text-transform: uppercase; outline: none; transition: all 0.2s; }
.field-input:focus { border-color: var(--blue); background: #fff; }

/* ═══════════════════════════════════════════════════════════════
   NUEVA ARQUITECTURA SECCIÓN RESUMEN (SUMBOX)
   ═══════════════════════════════════════════════════════════════ */
.sumbox {
  background: var(--card-bg);
  border: 1.5px solid var(--gray-200);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  margin-bottom: 24px;
}
.sum-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px; background: var(--navy); position: relative; overflow: hidden;
}
.sum-hd::before {
  content: ''; position: absolute; top: -28px; right: -28px; width: 110px; height: 110px;
  border-radius: 50%; background: radial-gradient(circle, rgba(91,142,255,0.2) 0%, transparent 70%);
}
.sum-hd-left { display: flex; align-items: center; gap: 10px; position: relative; z-index: 1; }
.sum-ttl { font-family: var(--font-display); font-size: 13px; font-weight: 700; color: #fff; letter-spacing: 1px; text-transform: uppercase; }

/* Badge de Estado */
.sum-badge {
  display: flex; align-items: center; gap: 6px; padding: 5px 12px;
  border-radius: 99px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
  text-transform: uppercase; position: relative; z-index: 1; transition: all .3s;
}
.sum-badge.pending { background: rgba(156,163,175,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
.sum-badge.ok { background: rgba(15,195,115,0.2); color: #0FC373; border: 1px solid rgba(15,195,115,0.3); }

/* Filas de Datos */
.sum-body { padding: 8px 0; }
.sum-row {
  display: grid; grid-template-columns: 140px 1fr; align-items: baseline;
  padding: 12px 20px; border-bottom: 1px solid var(--gray-100); transition: background .2s;
}
.sum-row:last-child { border-bottom: none; }
.sum-row:hover { background: rgba(22,93,255,0.02); }
.sum-label { font-size: 11px; font-weight: 600; color: var(--blue); text-transform: uppercase; letter-spacing: 0.5px; }
.sum-val { font-size: 14px; font-weight: 500; color: var(--navy); line-height: 1.4; }
.sum-val.empty { color: var(--gray-400); font-style: italic; font-size: 13px; }

/* Chips para valores especiales */
.val-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 6px; background: var(--gray-100);
  border: 1px solid var(--gray-200); font-size: 12px; font-weight: 600; color: var(--navy);
}

/* SUBMIT BUTTON */
.submit-area { background: var(--card-bg); border-radius: 20px; padding: 28px; box-shadow: var(--shadow); }
.submit-btn { width: 100%; background: var(--blue); color: #fff; border: none; border-radius: 12px; padding: 16px; font-family: 'Syne', sans-serif; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 16px; }
.submit-btn:hover { background: var(--navy); transform: translateY(-2px); }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo-text">AVA<span>.</span></div>
    <div class="header-title">Solicitud de <span>Arrendamiento Puro</span></div>
  </div>
</header>

<main class="main">
  <div class="form-card">
    <div class="section-header">
      <span class="section-title">01. Información General</span>
    </div>
    <div class="section-body">
      <div class="field-grid">
        <div class="field-group">
          <label class="field-label">Nombre / Razón Social</label>
          <input type="text" class="field-input" id="in-nombre" placeholder="Ej. Juan Pérez" oninput="updateSummary()">
        </div>
        <div class="field-group">
          <label class="field-label">RFC</label>
          <input type="text" class="field-input" id="in-rfc" placeholder="ABCD123456" maxlength="13" oninput="updateSummary()">
        </div>
        <div class="field-group">
          <label class="field-label">Tipo de Persona</label>
          <select class="field-input" id="in-tipo" onchange="updateSummary()">
            <option value="Física">Persona Física</option>
            <option value="Moral">Persona Moral</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">Teléfono</label>
          <input type="tel" class="field-input" id="in-tel" placeholder="55 1234 5678" oninput="updateSummary()">
        </div>
      </div>
    </div>
  </div>

  <div class="sumbox">
    <div class="sum-hd">
      <div class="sum-hd-left">
        <span class="sum-ttl">Resumen de Solicitud</span>
      </div>
      <div id="sum-status" class="sum-badge pending">Pendiente</div>
    </div>
    
    <div class="sum-body">
      <div class="sum-row">
        <span class="sum-label">Titular</span>
        <span id="sum-nombre" class="sum-val empty">No proporcionado</span>
      </div>
      <div class="sum-row">
        <span class="sum-label">Identificación</span>
        <span id="sum-rfc" class="sum-val empty">No proporcionado</span>
      </div>
      <div class="sum-row">
        <span class="sum-label">Configuración</span>
        <span id="sum-config" class="sum-val">
          <span class="val-chip" id="sum-tipo-chip">Persona Física</span>
        </span>
      </div>
      <div class="sum-row">
        <span class="sum-label">Contacto</span>
        <span id="sum-tel" class="sum-val empty">—</span>
      </div>
    </div>
  </div>

  <div class="submit-area">
    <button class="submit-btn">Enviar Expediente Digital</button>
  </div>
</main>

<script>
/**
 * Sincronización en tiempo real con la arquitectura de filas del resumen
 */
function updateSummary() {
  const fields = [
    { id: 'in-nombre', sumId: 'sum-nombre', fallback: 'No proporcionado' },
    { id: 'in-rfc',    sumId: 'sum-rfc',    fallback: 'No proporcionado' },
    { id: 'in-tel',    sumId: 'sum-tel',    fallback: '—' }
  ];

  fields.forEach(field => {
    const val = document.getElementById(field.id).value.trim();
    const el = document.getElementById(field.sumId);
    if(val) {
      el.textContent = val;
      el.classList.remove('empty');
    } else {
      el.textContent = field.fallback;
      el.classList.add('empty');
    }
  });

  // Actualizar Chip de Tipo
  document.getElementById('sum-tipo-chip').textContent = document.getElementById('in-tipo').value;

  // Actualizar Badge de Estado
  const isComplete = document.getElementById('in-nombre').value && document.getElementById('in-rfc').value;
  const badge = document.getElementById('sum-status');
  
  if(isComplete) {
    badge.textContent = "Listo para enviar";
    badge.className = "sum-badge ok";
  } else {
    badge.textContent = "Pendiente";
    badge.className = "sum-badge pending";
  }
}

// Inicializar estado del resumen
window.onload = updateSummary;
</script>

</body>
</html>
